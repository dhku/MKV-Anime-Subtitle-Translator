# NAS 실행 예시. 왼쪽 경로를 NAS 의 실제 폴더로 바꾸세요.
# 실행 1회마다 target 폴더를 처리하고 종료합니다. (작업 스케줄러 등으로 주기 실행)
#   docker compose run --rm subtitle-translator
services:
  subtitle-translator:
    build: .
    image: mkv-anime-subtitle-translator:latest
    platform: linux/amd64
    container_name: mkv-anime-subtitle-translator
    environment:
      - PUID=1026        # NAS 사용자 id  (id 명령으로 확인)
      - PGID=100         # NAS 그룹 id
      - TZ=Asia/Seoul
    volumes:
      - /volume1/docker/subtitle-translator:/app        # settings.yml, anime.yml, prompt.yml
      - /volume1/video/anime:/anime                     # 동영상 폴더
      - /volume1/docker/subtitle-translator/output:/app/output
      - /volume1/docker/subtitle-translator/log:/app/log
    restart: "no"
